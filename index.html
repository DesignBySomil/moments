<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>moments</title>
<meta name="theme-color" content="#050507">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; background:#050507; overflow:hidden; overscroll-behavior:none; }
  body { font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
         -webkit-font-smoothing:antialiased; touch-action:none; position:fixed; inset:0; }
  #stage { position:absolute; inset:0; width:100%; height:100%; display:block; }
  .chrome { position:absolute; z-index:2; color:#fff; opacity:0; transition:opacity .45s ease;
            pointer-events:none; user-select:none; -webkit-user-select:none; mix-blend-mode:difference; }
  .chrome.show { opacity:1; }
  #name { top:calc(12px + env(safe-area-inset-top)); left:calc(16px + env(safe-area-inset-left));
          font-size:11px; letter-spacing:.22em; text-transform:uppercase; font-weight:500;
          color:rgba(255,255,255,.55); }
  #count { top:calc(12px + env(safe-area-inset-top)); right:calc(16px + env(safe-area-inset-right));
           font-size:11px; letter-spacing:.14em; font-weight:500; color:rgba(255,255,255,.38);
           font-variant-numeric:tabular-nums; }
  #hint { bottom:calc(14px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%);
          font-size:10px; letter-spacing:.18em; text-transform:uppercase; color:rgba(255,255,255,.28); }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="name" class="chrome"></div>
<div id="count" class="chrome"></div>
<div id="hint" class="chrome">swipe</div>
<script>
(function () {
  var FILES = [
    'scenes-core.js',
    'scenes-bake-balloon.js', 'scenes-bake-bloom.js', 'scenes-bake-butterfly.js',
    'scenes-bake-candle.js', 'scenes-bake-cycle.js', 'scenes-bake-jellyfish.js',
    'scenes-bake-lantern2.js', 'scenes-bake-leaves.js', 'scenes-bake-lighthouse.js',
    'scenes-bake-pendulum.js', 'scenes-bake-swing.js', 'scenes-bake-train.js',
    'scenes-bake-wave.js', 'scenes-bake-windmill.js',
    'scenes-1.js', 'scenes-2.js', 'scenes-3.js', 'scenes-4.js', 'scenes-5.js',
    'engine.js', 'app.js'
  ];
  function showFailure(failed) {
    var el = document.createElement('div');
    el.style.cssText = 'position:absolute;inset:0;display:flex;align-items:center;justify-content:center;' +
      'color:rgba(255,255,255,.75);font:12px/1.7 -apple-system,Arial,sans-serif;letter-spacing:.12em;' +
      'text-transform:uppercase;text-align:center;z-index:3;cursor:pointer;padding:0 32px;';
    el.textContent = 'could not load ' + failed + ' - tap to retry';
    el.addEventListener('click', function () { location.reload(); });
    document.body.appendChild(el);
  }
  function loadOne(file, attempt, done) {
    var s = document.createElement('script');
    s.src = file + (attempt > 1 ? '?r=' + attempt : '');
    s.onload = function () { done(null); };
    s.onerror = function () {
      s.remove();
      if (attempt < 4) setTimeout(function () { loadOne(file, attempt + 1, done); }, 350 * attempt * attempt);
      else done(file);
    };
    document.head.appendChild(s);
  }
  var i = 0;
  (function next() {
    if (i >= FILES.length) return;
    var f = FILES[i++];
    loadOne(f, 1, function (err) { if (err) showFailure(err); else next(); });
  })();
})();
</script>
</body>
</html>
