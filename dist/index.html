      if (vnoise(X * 2.6, Y * 1.4) > 0.78 && Y < gy + u * 0.05) res = over(res, [0.38, 1]); // blade tips
    }
    // frame: top bar + angled legs, shaded with moon rim
    const frameParts = [[-W, by, W, by], [-W, by, -W - u * 0.04, gy], [W, by, W + u * 0.04, gy]];
    for (const [x0, y0, x1, y1] of frameParts) {
      const sdF = (px, py) => sdSeg(px, py, x0, y0, x1, y1) - u * 0.016;
      const dF = sdF(X, Y);
      if (dF < 1.0) {
        const sh = shade(sdF, X, Y, 0.5, -0.75);
        if (sh > 0) res = over(res, [clamp(sh * 1.2 + 0.05, 0, 1), 1]);
      }
    }
    // pendulum
    const a = 0.38 * S(t, 1);
    const L = u * 0.34;
    const sx = Math.sin(a) * L, sy = by + Math.cos(a) * L;
    // cast shadow on the ground, swinging with the seat
    if (Y > gy && sdE(X, Y, Math.sin(a) * L * 1.15, gy + u * 0.025, u * 0.06, u * 0.013) < 0) res = over(res, [0.05, 1]);
    // chains with link texture
    for (let s = -1; s <= 1; s += 2) {
      const ex = sx + s * u * 0.045;
      const dR = sdSeg(X, Y, s * u * 0.007, by, ex, sy) - u * 0.0035;
      if (dR < 0.6) {
        const along = ((X - s * u * 0.007) * (ex - s * u * 0.007) + (Y - by) * (sy - by)) / (L * L);
        const link = 0.55 + 0.45 * Math.sin(along * L * 2.2);
        const v = glow(dR, 0.6) * link;
        if (v > 0.07) res = over(res, [clamp(v, 0, 1), 0]);
      }
    }
    // wooden plank: three boards, hot moonlit top edge, dark underside
    const sdSeat = (px, py) => sdBox(px, py, sx, sy, u * 0.052, u * 0.017) - u * 0.004;
    const dS = sdSeat(X, Y);
    if (dS < 0.8) {
      let v = clamp(0.98 - 1.05 * ss(-u * 0.016, u * 0.020, Y - sy), 0.10, 1);
      if (Y < sy - u * 0.010) v = Math.min(1, v + 0.25);
      if (Math.abs(X - sx - u * 0.021) < u * 0.0016 || Math.abs(X - sx + u * 0.021) < u * 0.0016) v *= 0.45; // board seams
      if (v > 0.04) res = over(res, [clamp(v, 0, 1), 0]);
    }
    // foreground grass tufts, dark silhouettes at the bottom edge
    if (Y > u * 0.93) {
      const b = vnoise(X * 3.4, 7.7);
      if (b > 0.62 && Y > u * 0.93 + (b - 0.62) * u * 0.3) res = over(res, [0.06, 1]);
    }
    return res;
  });

  add('sprout', '#101a10', ['#a8e88a', '#e8f5d8'], 16, (x, y, t, cols, rows) => {
    const X = (x - cols / 2) / 1.06, Y = y, u = rows;
    let res = 0;
    const sway = S(t, 0.9) * u * 0.012;
    const apexX = sway, apexY = u * 0.47;
    // soil mound: small, dark, lit crest
    const dMound = sdE(X, Y, 0, u * 1.07, u * 0.22, u * 0.13);
    if (dMound < 0) {
      const crest = ss(u * 0.10, 0, Y - u * 0.94);
      res = over(res, [0.10 + 0.30 * crest + 0.07 * fbm(X * 1.6, Y * 1.6, 2), 0]);
    }
    // stem: tapered two-segment column, shaded
    const sdStem = (px, py) => Math.min(
      sdSeg(px, py, 0, u * 0.94, sway * 0.4, u * 0.72) - u * 0.019,
      sdSeg(px, py, sway * 0.4, u * 0.72, sway, apexY) - u * 0.013);
    if (Math.abs(X) < u * 0.08 && Y > apexY - 3 && Y < u * 0.97) {
      const sh = shade(sdStem, X, Y, -0.6, -0.7);
      if (sh > 0) res = over(res, [clamp(sh * 1.5, 0, 1), 0]);
    }
    // plump shaded vesica leaves with a midrib crease
    const drawLeaf = (bx2, by2, ang, b, w, boost, ink) => {
      const dd = (b * b - w * w) / (2 * w), rr = w + dd;
      const ux2 = Math.sin(ang), uy2 = -Math.cos(ang);
      const cx2 = bx2 + ux2 * b, cy2 = by2 + uy2 * b;
      const RY = (X - cx2) * ux2 + (Y - cy2) * uy2;
      const RX = -(X - cx2) * uy2 + (Y - cy2) * ux2;
      if (Math.abs(RY) > b * 1.7 || Math.abs(RX) > w * 2.0) return;
      const sdLf = (px, py) => {
        const qy = (px - cx2) * ux2 + (py - cy2) * uy2;
        const qx = -(px - cx2) * uy2 + (py - cy2) * ux2;
        return sdVesica(qx, qy, 0, 0, rr, dd);
      };
      const sh = shade(sdLf, X, Y, -0.62, -0.72);
      if (sh > 0) {
        let v = sh * boost;
        if (Math.abs(RX) < u * 0.0028) v *= 0.52;
        res = over(res, [clamp(v, 0, 1), ink]);
      }
    };
    const wig = 0.025 * S(t, 1.3), wig2 = 0.03 * S(t, 1.3, 2.2);
    // cotyledons: slender ovals spread wide, dark wedge between them
    drawLeaf(apexX + u * 0.008, apexY + u * 0.010, 1.08 + wig, u * 0.072, u * 0.029, 1.38, 1);
    drawLeaf(apexX - u * 0.008, apexY + u * 0.052, -1.14 + wig2, u * 0.067, u * 0.027, 1.38, 1);
    // dew specks
    const g = drift(X, Y, t, { gain: 0.12, thresh: 0.94, speed: 1.2 });
    if (g > 0) res = over(res, [g, 1]);
    return res;
  });
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* inlined: engine.js */
/* Dense tonal character renderer. Every mark is a literal ASCII glyph drawn
   from a prerendered atlas; scenes are animated tonal fields. */
'use strict';
const Engine = (() => {
  const canvas = document.getElementById('stage');
  const ctx = canvas.getContext('2d');
  const RAMP = ' .:-=+*x#%@';
  let scene = null, W = 0, H = 0, dpr = 1, cols = 0, rows = 0, cw = 0, ch = 0;
  let atlas = null, lastFrame = 0;

  function buildAtlas() {
    const fs = ch * 0.98 * dpr;
    atlas = scene.inks.map(color => RAMP.split('').map(c => {
      const cv = document.createElement('canvas');
      cv.width = Math.max(2, Math.ceil(cw * dpr));
      cv.height = Math.max(2, Math.ceil(ch * dpr));
      const c2 = cv.getContext('2d');
      c2.font = '700 ' + fs + 'px "Courier New", monospace';
      c2.textAlign = 'center'; c2.textBaseline = 'middle';
      c2.fillStyle = color;
      c2.fillText(c, cv.width / 2, cv.height / 2 + fs * 0.02);
      return cv;
    }));
  }

  function resize() {
    W = innerWidth; H = innerHeight; dpr = Math.min(devicePixelRatio || 1, 1.5);
    cols = Math.max(68, Math.min(178, Math.round(W / 8.2)));
    cw = W / cols; ch = cw * 1.06; rows = Math.ceil(H / ch); ch = H / rows;
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    if (scene) buildAtlas();
  }
  addEventListener('resize', resize);

  function render(time, alpha = 1, force = false) {
    if (!scene) return;
    if (!force && time - lastFrame < 1 / 32) return; // ~30fps cap, plenty for tonal motion
    lastFrame = time;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = scene.bg; ctx.fillRect(0, 0, canvas.width, canvas.height);
    const t = ((time % scene.loop) + scene.loop) % scene.loop / scene.loop;
    const pw = cw * dpr, ph = ch * dpr;
    ctx.globalAlpha = alpha;
    for (let y = 0; y < rows; y++) {
      for (let x = 0; x < cols; x++) {
        const v = scene.f(x, y, t, cols, rows);
        if (!v) continue;
        let i, ink = 0, a = 1;
        if (typeof v === 'number') i = v; else { i = v[0]; ink = v[1] || 0; a = v[2] == null ? 1 : v[2]; }
        if (i <= 0.045) continue;
        let lvl = (i * (RAMP.length - 1) + 0.5) | 0;
        if (lvl < 1) lvl = 1; if (lvl >= RAMP.length) lvl = RAMP.length - 1;
        if (a !== 1) ctx.globalAlpha = alpha * a;
        ctx.drawImage(atlas[ink][lvl], (x * cw * dpr) | 0, (y * ch * dpr) | 0, pw, ph);
        if (a !== 1) ctx.globalAlpha = alpha;
      }
    }
    ctx.globalAlpha = 1;
  }

  resize();
  return {
    render, resize,
    setScene(s) { scene = s; if (s) buildAtlas(); },
    get scene() { return scene; },
    get RAMP() { return RAMP; }
  };
})();

</script>
<script>
/* inlined: app.js */
/* moments - carousel shell: swipe / keys / hash routing, auto-hiding chrome */
'use strict';
(function () {
  const SCENES = window.ASCII_SCENES;
  const nameEl = document.getElementById('name');
  const countEl = document.getElementById('count');
  const hintEl = document.getElementById('hint');
  const params = new URLSearchParams(location.search);
  const CLEAN = params.has('clean');
  const STILL = params.has('t'); // test hook: freeze phase

  let idx = 0;
  const fromHash = () => {
    const h = location.hash.replace(/^#\/?/, '');
    const i = SCENES.findIndex(s => s.id === h);
    if (i >= 0) idx = i;
  };
  fromHash();

  let chromeTimer = 0;
  function showChrome() {
    if (CLEAN) return;
    nameEl.textContent = SCENES[idx].name;
    countEl.textContent = String(idx + 1).padStart(2, '0') + ' / ' + SCENES.length;
    nameEl.classList.add('show'); countEl.classList.add('show');
    if (!sessionStorage.getItem('hinted')) hintEl.classList.add('show');
    clearTimeout(chromeTimer);
    chromeTimer = setTimeout(() => {
      nameEl.classList.remove('show'); countEl.classList.remove('show'); hintEl.classList.remove('show');
    }, 1400);
  }

  let alpha = 1, targetAlpha = 1, pendingIdx = -1;
  function goTo(i) {
    const n = (i + SCENES.length) % SCENES.length;
    if (n === idx) return;
    pendingIdx = n;
    targetAlpha = 0;
  }

  Engine.setScene(SCENES[idx]);
  showChrome();
  setTimeout(() => { sessionStorage.setItem('hinted', '1'); hintEl.classList.remove('show'); }, 3200);

  // swipe
  let sx = 0, sy = 0, st = 0, tracking = false;
  window.addEventListener('pointerdown', e => { sx = e.clientX; sy = e.clientY; st = performance.now(); tracking = true; showChrome(); });
  window.addEventListener('pointercancel', () => { tracking = false; });
  window.addEventListener('pointerup', e => {
    if (!tracking) return; tracking = false;
    const dx = e.clientX - sx, dy = e.clientY - sy, dt = performance.now() - st;
    if (Math.abs(dx) > 48 && Math.abs(dx) > Math.abs(dy) * 1.4) {
      goTo(idx + (dx < 0 ? 1 : -1));
    }
  });
  window.addEventListener('keydown', e => {
    showChrome();
    if (e.key === 'ArrowRight') goTo(idx + 1);
    if (e.key === 'ArrowLeft') goTo(idx - 1);
  });
  window.addEventListener('hashchange', () => { const p = idx; fromHash(); if (idx !== p) { pendingIdx = idx; targetAlpha = 0; } });

  let start = performance.now(), lastNow = start;
  function frame(now) {
    const dtF = Math.min(0.1, (now - lastNow) / 1000); lastNow = now;
    const time = STILL ? parseFloat(params.get('t')) * Engine.scene.loop : (now - start) / 1000;
    // transition fade (time-based: ~0.35s each way regardless of frame rate)
    alpha += (targetAlpha - alpha) * Math.min(1, dtF * 18);
    if (targetAlpha === 0 && alpha < 0.02 && pendingIdx >= 0) {
      idx = pendingIdx; pendingIdx = -1;
      Engine.setScene(SCENES[idx]);
      history.replaceState(null, '', '#/' + SCENES[idx].id);
      targetAlpha = 1;
      showChrome();
    }
    Engine.render(time, alpha);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();

</script>
